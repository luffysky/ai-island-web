<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.55" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <!-- antenna -->
  <line x1="128" y1="52" x2="128" y2="80" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  <circle cx="128" cy="46" r="12" fill="#ffffff"/>
  <!-- robot head -->
  <rect x="66" y="80" width="124" height="104" rx="30" fill="url(#face)"/>
  <!-- ears -->
  <rect x="52" y="112" width="16" height="40" rx="8" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="188" y="112" width="16" height="40" rx="8" fill="#ffffff" fill-opacity="0.85"/>
  <!-- eyes -->
  <circle cx="103" cy="126" r="15" fill="#5b3df5"/>
  <circle cx="153" cy="126" r="15" fill="#5b3df5"/>
  <circle cx="108" cy="121" r="5" fill="#ffffff"/>
  <circle cx="158" cy="121" r="5" fill="#ffffff"/>
  <!-- smile -->
  <path d="M100 156 q28 24 56 0" fill="none" stroke="#5b3df5" stroke-width="9" stroke-linecap="round"/>
</svg>
