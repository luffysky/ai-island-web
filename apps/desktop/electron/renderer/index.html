<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>AI 島桌面助手</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, "Microsoft JhengHei", sans-serif; background: #0e0f13; color: #e6e6ea; }
  header { padding: 16px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #23252d; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #555; box-shadow: 0 0 0 0 rgba(0,0,0,0); }
  .dot.on { background: #34d399; box-shadow: 0 0 10px #34d39988; }
  h1 { font-size: 15px; margin: 0; font-weight: 700; }
  .sub { font-size: 12px; color: #8b8d98; }
  .bar { padding: 12px 18px; display: flex; gap: 8px; }
  button { border: 0; border-radius: 10px; padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .start { background: #7c5cff; color: #fff; }
  .stop { background: #f43f5e; color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  pre { margin: 0; padding: 12px 18px; font-size: 11.5px; line-height: 1.5; height: calc(100vh - 132px);
        overflow: auto; white-space: pre-wrap; word-break: break-all; background: #0b0c10; }
</style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <div>
      <h1>AI 島桌面助手</h1>
      <div class="sub" id="status">已停止 — 按「啟動」開始接受 /agent 任務</div>
    </div>
  </header>
  <div class="bar">
    <button class="start" id="startBtn">▶ 啟動</button>
    <button class="stop" id="stopBtn" disabled>■ 停止</button>
  </div>
  <pre id="log">設定：編輯本資料夾的 bridge.config.json（貼上 token、設定允許資料夾）。\n</pre>
<script>
  const dot = document.getElementById("dot"), status = document.getElementById("status");
  const startBtn = document.getElementById("startBtn"), stopBtn = document.getElementById("stopBtn"), log = document.getElementById("log");
  window.bridge.onLog((line) => { log.textContent += line; log.scrollTop = log.scrollHeight; });
  window.bridge.onState((running) => {
    dot.classList.toggle("on", running);
    status.textContent = running ? "執行中 — 正在等待 /agent 的任務" : "已停止";
    startBtn.disabled = running; stopBtn.disabled = !running;
  });
  startBtn.onclick = () => window.bridge.start();
  stopBtn.onclick = () => window.bridge.stop();
</script>
</body>
</html>
