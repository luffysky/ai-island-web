name: Build & push image to GHCR

# push 到 main 就自動 build（用 repo 根目錄的 Dockerfile）並推到 GHCR，
# 然後 Zeabur 直接拉這個 image，繞開 registry-oci.zeabur.cloud。
#
# 💸 省 Actions 分鐘數：
#  - paths-ignore：純文件 / SQL / 腳本的 commit「不會」觸發 build（這些不進 runtime image）。
#    DB migration 是本地手動跑、章節內容是同步進 DB，都不需要重建 image。
#
# ⚠️ 不用 concurrency：GitHub 的 concurrency 不管 cancel-in-progress true/false，只要有較新的
#    run 排進同組，就會「取消被取代的 run」（true 取消進行中、false 取消還在排隊的 pending）→
#    兩種都會冒出「Error: The operation was canceled」紅叉。要「完全不出現取消」唯一辦法＝不設 concurrency。
#    代價：連續推多 commit 會各自 build（平行、較耗分鐘、最後完成的 redeploy 勝出；image 累加式故最終正確）。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'supabase/**'
      - 'scripts/**'
      - '.gitignore'
      - 'bug/**'
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # = luffysky/ai-island-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runner 預裝的 android/dotnet/ghc/CodeQL 等佔 ~15GB+，本 job 用不到。
      # image 內裝 Chromium(+500MB) 後容易「no space left on device」→ 先清出空間。
      - name: Free disk space (runner)
        run: |
          echo "== before =="; df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell \
            /usr/lib/jvm 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "== after =="; df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags / labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 關掉 build-push-action 預設的 provenance / SBOM attestation：
          # 少推幾個 artifact（image 更單純）、也少一個 GHCR push 的 403 觸發點。runtime 不受影響。
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* 在 build 階段被 inline 進前端 bundle，
          # 從 repo「Variables」傳入（Settings → Secrets and variables → Actions → Variables）。
          # vars 沒設就 fallback 去讀 secrets（你設在哪邊都能讀到）
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_ADMIN_SLUG=${{ vars.NEXT_PUBLIC_ADMIN_SLUG || secrets.NEXT_PUBLIC_ADMIN_SLUG }}
            NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID || secrets.NEXT_PUBLIC_GA_ID }}
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID || secrets.NEXT_PUBLIC_GTM_ID }}
            NEXT_PUBLIC_LINE_CHANNEL_ID=${{ vars.NEXT_PUBLIC_LINE_CHANNEL_ID || secrets.NEXT_PUBLIC_LINE_CHANNEL_ID }}
            NEXT_PUBLIC_CONTENT_SOURCE=${{ vars.NEXT_PUBLIC_CONTENT_SOURCE || secrets.NEXT_PUBLIC_CONTENT_SOURCE }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN || secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_USER_LINE_BOT_BASIC_ID=${{ vars.NEXT_PUBLIC_USER_LINE_BOT_BASIC_ID || secrets.NEXT_PUBLIC_USER_LINE_BOT_BASIC_ID }}
            NEXT_PUBLIC_GIPHY_API_KEY=${{ vars.NEXT_PUBLIC_GIPHY_API_KEY || secrets.NEXT_PUBLIC_GIPHY_API_KEY }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILT_AT=${{ github.event.head_commit.timestamp }}
            # 分身島 L2 伺服器瀏覽器：image 內裝 Chromium（+300~500MB）。
            # runtime 仍需 Zeabur env ENABLE_SERVER_BROWSER=1 才會真的啟用（沒設＝裝了但不用、graceful）。
            INSTALL_SERVER_BROWSER=1

      # image 推完後、自動打 Zeabur GraphQL API 觸發該服務重部署、拉最新 image。
      # 因為 Zeabur 是 Prebuilt Image 模式、不會自己重拉 :latest、所以這裡主動觸發。
      # serviceID / environmentID 非機密、直接寫；token 放 GitHub secret。
      # ⚠️ 重點：image 已在上一步 build + push 成功。這步只是「觸發 Zeabur 重拉」、
      # 失敗不該讓整個 workflow 變紅（不然會誤以為「部署錯誤」、但其實 image 是好的）。
      # → continue-on-error + 不 exit 1；先試 restartService、失敗再試 redeployService。
      - name: Trigger Zeabur redeploy
        continue-on-error: true
        env:
          ZEABUR_API_TOKEN: ${{ secrets.ZEABUR_API_TOKEN }}
          SERVICE_ID: "6a2dd61f00b9937b8de229c3"
          ENVIRONMENT_ID: "6a00c698e5ed304c1d845a93"
        run: |
          trigger() {
            local mut="$1"
            local q="mutation { $mut(serviceID: \"$SERVICE_ID\", environmentID: \"$ENVIRONMENT_ID\") }"
            local payload; payload=$(jq -nc --arg q "$q" '{query: $q}')
            curl -sS -X POST https://api.zeabur.com/graphql \
              -H "Authorization: Bearer $ZEABUR_API_TOKEN" -H "Content-Type: application/json" -d "$payload"
          }
          resp=$(trigger "restartService")
          echo "restartService -> $resp"
          if echo "$resp" | grep -q '"errors"'; then
            resp2=$(trigger "redeployService")
            echo "redeployService -> $resp2"
            if echo "$resp2" | grep -q '"errors"'; then
              echo "::warning::Zeabur 自動重部署觸發失敗（image 已成功推上 GHCR、請到 Zeabur 手動 Restart 拉 :latest）"
            else
              echo "✅ redeployService 觸發成功"
            fi
          else
            echo "✅ restartService 觸發成功"
          fi

      # 根治儲存膨脹：image 裝了 Chromium(~1GB)、每個 commit 又推一個 sha-xxxx tag，
      # 版本會越積越多、吃爆 GHCR 儲存配額（就會出現推 blob 403）。
      # → 只保留最近 15 個版本（含 :latest 與最近幾個 sha- 可回滾），其餘自動刪。
      # continue-on-error：清理失敗絕不能讓部署變紅（image 早已推成功）。
      # ⚠️ user-owned package 刪版本可能需要 packages: delete 權限；GITHUB_TOKEN 不夠時
      #    這步會 fail（已 continue-on-error 吞掉），可改放一顆有 delete:packages 的 PAT 到
      #    secrets.GHCR_CLEANUP_PAT（沒有就沿用 GITHUB_TOKEN）。
      - name: Prune old GHCR versions (keep latest 15)
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: ai-island-web
          package-type: container
          min-versions-to-keep: 15
          delete-only-untagged-versions: false
          token: ${{ secrets.GHCR_CLEANUP_PAT || secrets.GITHUB_TOKEN }}
