name: CI

# PR 與 push main 都跑：lint → typecheck → 單元測試 → build。
# 目的：擋住「合進 main 才發現壞掉」。真正的部署 image 由 docker.yml 負責、跟這支無關。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 對齊 Dockerfile 的 runtime
          cache: npm

      # repo 有 .npmrc（legacy-peer-deps=true）→ npm ci 會自動吃、不用額外傳參。
      - name: Install deps
        run: npm ci

      # lint 目前可能還有 warning / legacy 問題 → 不讓它擋 CI（只當提示）。
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # 型別檢查：專案可能有既有 tsc 錯誤（legacy debt）→ 先設 continue-on-error、
      # 不讓 CI 因為舊債變紅。等舊錯誤清乾淨後、把這行拿掉讓它變硬性關卡。
      - name: Typecheck
        run: npx tsc --noEmit
        continue-on-error: true

      # 單元測試：必須全過（這是這支 workflow 的硬性關卡）。
      - name: Unit tests
        run: npm run test

      # build：也必須綠（確認能真的建出來）。
      # ⚠️ next build 會 prerender-probe 頁面、server component 會建 Supabase client，
      #    所以要跟 docker.yml「完全一致」地把 env 帶進來、否則 build 時會炸：
      #    - NEXT_PUBLIC_SUPABASE_*：browser client（/settings 之類）
      #    - SUPABASE_SERVICE_ROLE_KEY：有些公開頁（/forum …）prerender 時走 admin client 讀 DB、
      #      缺了會 hard-throw「required env var SUPABASE_SERVICE_ROLE_KEY is missing」→ 整個 build 失敗。
      #      docker.yml 早就有帶這個 secret（所以部署 image 一直是綠的）、CI 要對齊才不會誤紅。
      - name: Build
        run: npm run build
        env:
          # 專案已大（80 章 JSON + 補助文全文 bundle + 四語 messages…）→ 預設 2GB heap 會 OOM(exit 134)。
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_SITE_URL: https://ai-island-web.snowrealm.pet
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
